AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AegisFlow — Shield Ops Console edge stack (Team Alpha, AWS x A10 Hack 2026).
  CloudFront + WAFv2 + private S3 origin reference stack. Not deployed or live-
  account validated by this submission. Shield Advanced is optional and is not
  provisioned. The Node console requires a separate backend host.

Resources:
  OriginBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aegisflow-origin-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --- IP set the console's `block` playbook populates via aws-adapter.js ---
  AttackerIPSet:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: aegisflow-blocked-ips
      Scope: CLOUDFRONT
      IPAddressVersion: IPV4
      Addresses: []

  # NOTE: Shield Advanced is an account-level subscription enabled via the Shield
  # console/API separately. No Shield Advanced subscription is created here.

  EdgeWAF:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: aegisflow-edge
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      Rules:
        # playbook: rate-limit (maps to console rate-limit spec.limit * 60)
        - Name: aegisflow-rate-limit
          Priority: 1
          Statement:
            RateBasedStatement: { Limit: 1500, EvaluationWindowSec: 60, AggregateKeyType: IP }
          Action: { Block: {} }
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: ratelimit, SampledRequestsEnabled: true }
        # playbook: challenge on sensitive paths (CAPTCHA action)
        - Name: aegisflow-challenge-login
          Priority: 2
          Statement:
            ByteMatchStatement:
              FieldToMatch: { UriPath: {} }
              PositionalConstraint: STARTS_WITH
              SearchString: /api/login
              TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
          Action: { Captcha: {} }
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: challenge, SampledRequestsEnabled: true }
        # playbook: block (IPSet fed by the console dispatcher)
        - Name: aegisflow-block-list
          Priority: 3
          Statement:
            IPSetReferenceStatement: { ARN: !GetAtt AttackerIPSet.Arn }
          Action: { Block: {} }
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: blocklist, SampledRequestsEnabled: true }
        # AWS managed baseline
        - Name: AWSManagedCommon
          Priority: 4
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: managed, SampledRequestsEnabled: true }
      VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: aegisflow-waf, SampledRequestsEnabled: true }

  EdgeCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: origin
            DomainName: !GetAtt OriginBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${OriginOAI}' }
        DefaultCacheBehavior:
          TargetOriginId: origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        # cache playbook: additional cache policies for static assets absorb GET floods
        WebACLId: !GetAtt EdgeWAF.Arn

  OriginOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig: { Comment: aegisflow-oai }

  OriginBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OriginBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt OriginOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub '${OriginBucket.Arn}/*'

  # --- console KPIs stream as custom metrics; alarms page the operator ---
  AnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: aegisflow-origin-rps-spike
      Namespace: AegisFlow/Mitigations
      MetricName: Applied
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertTopic]

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties: { TopicName: aegisflow-alerts }

Outputs:
  StaticOriginUrl: { Value: !Sub 'https://${EdgeCDN.DomainName}' }
  OriginBucketName: { Value: !Ref OriginBucket }
  WebACLId: { Value: !GetAtt EdgeWAF.Id }
  WebACLName: { Value: aegisflow-edge }
  BlockedIPSetId: { Value: !GetAtt AttackerIPSet.Id }
  BlockedIPSetName: { Value: aegisflow-blocked-ips }
  BlockedIPSetArn: { Value: !GetAtt AttackerIPSet.Arn }

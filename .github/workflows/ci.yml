name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: smoke — server boots and serves the console
        run: |
          node server.js &
          SERVER_PID=$!
          ok=""
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "server did not become healthy in 20s"; exit 1; fi
          curl -fsS http://localhost:8080/ | grep -q "AEGISFLOW"
          kill $SERVER_PID
